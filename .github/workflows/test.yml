name: Rspec
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '*' ]

jobs:
  build-image:
    name: tasks-test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.calc-hash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate Hash
        id: calc-hash
        run: |
          # Create a combined hash of Dockerfile.test and Gemfile.lock
          HASH=$(sha256sum Dockerfile.test Gemfile Gemfile.lock | sha256sum | cut -c1-7)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if Image Exists
        id: check-image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/benyehuda-cases-server-test:${{ steps.calc-hash.outputs.hash }}"
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/benyehuda-cases-server-test:${{ steps.calc-hash.outputs.hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Run Specs
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/benyehuda-cases-server-test:${{ needs.build-image.outputs.image_tag }}
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mark repository as safe
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Verify MySQL connection from host
        run: |
          mysql --host mysql --port 3306 -uroot -proot --ssl-verify-server-cert=false \
            -e "SHOW GRANTS FOR 'root'@'localhost'"
      - name: Update Configuration
        run: |
          echo DATABASE_URL=mysql2://root:root@mysql:3306/tasks_test >> ./.env.test.local
      - name: Setup DB
        run: |
          bin/rails db:create RAILS_ENV=test
          bin/rails db:schema:load RAILS_ENV=test
      - name: Install js dependencies
        run: yarn install
      - name: Run tests
        env:
          DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL: "true"
        run: |
          bundle exec rspec --exclude-pattern "spec/system/**/*_spec.rb"
